<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="description" content="Weekmenu en boodschappenlijst: weekmenu samenstellen, boodschappen genereren en voorraad beheren. Alles lokaal op je eigen apparaat." />
  <title>Weekmenu &amp; Boodschappenlijst</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Weekmenu" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="root"></div>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="src/app.js"></script>
  <script>
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
    }
  </script>
</body>
</html>
