<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#059669" />
  <meta name="description" content="Weekmenu en boodschappenlijst: weekmenu samenstellen, boodschappen genereren en voorraad beheren. Alles lokaal op je eigen apparaat." />
  <title>Weekmenu &amp; Boodschappenlijst</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Weekmenu" />
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body class="bg-stone-50 text-stone-800">
  <div id="root"></div>
  <script>
    // Fouten tonen op het scherm i.p.v. een wit scherm (diagnose).
    function showFatal(msg) {
      try {
        var d = document.createElement("div");
        d.setAttribute("style", "padding:16px;color:#b91c1c;background:#fee2e2;font-family:monospace;word-break:break-all");
        d.textContent = "Fout bij opstarten: " + msg;
        document.body.appendChild(d);
      } catch (e) {}
    }
    window.addEventListener("error", function (e) { showFatal((e && (e.message || e.error)) || "onbekende fout"); });
  </script>
  <script src="vendor/react.min.js?v=5"></script>
  <script src="vendor/react-dom.min.js?v=5"></script>
  <script src="src/app.js?v=5"></script>
  <script>
    try {
      var root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(React.createElement(App));
    } catch (e) {
      showFatal((e && e.message) || String(e));
    }
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
          .then(function (reg) { return reg.update(); })
          .catch(function () {});
        var reloaded = false;
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (!reloaded) { reloaded = true; location.reload(); }
        });
      });
    }
  </script>
</body>
</html>
