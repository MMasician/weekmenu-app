<rect width="390" height="844" fill="#fafaf9"/><rect width="390" height="844" fill="rgba(0,0,0,.4)"/><rect x="0" y="300" width="390" height="544" rx="16" fill="#fff"/><rect x="175" y="308" width="40" height="4" rx="2" fill="#d6d3d1"/><text x="16" y="344" font-size="14" fill="#292524" font-weight="600">Delen via bestand</text><text x="374" y="344" font-size="16" fill="#a8a29e" text-anchor="end">✕</text><text x="16" y="372" font-size="12" fill="#78716c" font-weight="500">Wat neem je op in het deelbestand?</text><rect x="16" y="394" width="18" height="18" rx="5" fill="#059669" stroke="#059669" stroke-width="1.4"/><path d="M 19.5 403 l 3.4 3.6 l 6.2 -7.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="405" font-size="13.5" fill="#292524" font-weight="500">Weekmenu &amp; vergrendelingen</text><text x="46" y="422" font-size="11" fill="#a8a29e">12 dagen bewaard</text><rect x="16" y="440" width="18" height="18" rx="5" fill="#059669" stroke="#059669" stroke-width="1.4"/><path d="M 19.5 449 l 3.4 3.6 l 6.2 -7.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="451" font-size="13.5" fill="#292524" font-weight="500">Receptenpool</text><text x="46" y="468" font-size="11" fill="#a8a29e">42 recepten</text><rect x="16" y="486" width="18" height="18" rx="5" fill="#059669" stroke="#059669" stroke-width="1.4"/><path d="M 19.5 495 l 3.4 3.6 l 6.2 -7.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="497" font-size="13.5" fill="#292524" font-weight="500">Voorraad &amp; locaties</text><text x="46" y="514" font-size="11" fill="#a8a29e">5 locaties · 17 producten</text><rect x="16" y="532" width="18" height="18" rx="5" fill="#059669" stroke="#059669" stroke-width="1.4"/><path d="M 19.5 541 l 3.4 3.6 l 6.2 -7.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="543" font-size="13.5" fill="#292524" font-weight="500">Productcatalogus</text><text x="46" y="560" font-size="11" fill="#a8a29e">83 producten</text><rect x="16" y="578" width="18" height="18" rx="5" fill="#059669" stroke="#059669" stroke-width="1.4"/><path d="M 19.5 587 l 3.4 3.6 l 6.2 -7.4" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="46" y="589" font-size="13.5" fill="#292524" font-weight="500">Boodschappen-extra's</text><text x="46" y="606" font-size="11" fill="#a8a29e">6 artikelen</text><rect x="16" y="624" width="18" height="18" rx="5" fill="#fff" stroke="#d6d3d1" stroke-width="1.4"/><text x="46" y="635" font-size="13.5" fill="#292524" font-weight="500">Instellingen (eters, weekstart, winkels)</text><text x="46" y="652" font-size="11" fill="#a8a29e"></text><rect x="16" y="695" width="358" height="40" rx="12" fill="#292524"/><text x="195" y="720" font-size="14" fill="#fff" font-weight="500" text-anchor="middle">Maak deelbestand (.json)</text><text x="16" y="759" font-size="11" fill="#78716c">Daarna kies je zelf hoe je het deelt: WhatsApp, e-mail,</text>
<text x="16" y="774" font-size="11" fill="#78716c">AirDrop, of via een gedeelde map. De app stuurt nooit</text>
<text x="16" y="789" font-size="11" fill="#78716c">iets automatisch weg — ook niet bij het genereren.</text></svg>