<text x="16" y="122" font-size="13" fill="#292524" font-weight="700">VANDAAG · di 25 nov</text><text x="16" y="140" font-size="10" fill="#78716c">Week van za 22 nov – vr 28 nov</text><rect x="16" y="152" width="130" height="30" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="81" y="171" font-size="10" fill="#44403c" text-anchor="middle">📅 Kies een datum ▾</text><rect x="254" y="152" width="120" height="30" rx="8" fill="#292524" stroke="none"/><text x="314" y="171" font-size="10" fill="#fff" text-anchor="middle" font-weight="600">Genereer weekmenu</text><rect x="16" y="196" width="358" height="66" rx="12" fill="#d1fae5" stroke="#f0efed"/><text x="28" y="222" font-size="12" fill="#065f46" font-weight="600">di</text><text x="28" y="237" font-size="8" fill="#a8a29e">25 nov · vandaag</text><rect x="86" y="208" width="178" height="28" rx="8" fill="#fff" stroke="#d6d3d1"/><text x="94" y="226" font-size="10" fill="#292524">Stamppot boerenkool</text><rect x="86" y="242" width="39" height="14" rx="7" fill="#f5f5f4" stroke="#e7e5e4"/><text x="105.5" y="252.5" font-size="8" fill="#78716c" text-anchor="middle">vega</text><rect x="150" y="242" width="57" height="14" rx="7" fill="#f5f5f4" stroke="#e7e5e4"/><text x="178.5" y="252.5" font-size="8" fill="#78716c" text-anchor="middle">normaal</text><text x="276" y="228" font-size="12" fill="#57534e">👥</text><text x="292" y="228" font-size="11" fill="#57534e">✅</text><text x="310" y="229" font-size="13" fill="#57534e">🪫</text><rect x="326" y="212" width="26" height="26" rx="6" fill="#fef3c7" stroke="#d6d3d1"/><text x="339" y="229" font-size="11" fill="#57534e" text-anchor="middle">🔒</text><rect width="390" height="844" fill="#1c1917" opacity="0.4"/><rect x="0" y="220" width="390" height="300" rx="16" fill="#fff"/><rect x="175" y="232" width="40" height="4" rx="2" fill="#d6d3d1" stroke="none"/><text x="16" y="262" font-size="14" fill="#292524" font-weight="600">Afwijking · di 25 nov</text><text x="370" y="262" font-size="14" fill="#a8a29e