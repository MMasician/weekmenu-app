<svg xmlns='http://www.w3.org/2000/svg' width='390' height='844' viewBox='0 0 390 844' font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width='390' height='844' fill='#f4f6f4'/>
  <rect width='390' height='64' fill='#1f7a3d'/>
  <text x='20' y='41' font-size='19' font-weight='600' fill='#ffffff'>Samenvoegen</text>
  <text x='368' y='41' font-size='20' fill='#ffffff' text-anchor='end'>✕</text>

  <!-- varianten: compact, kanjer subtiel als 'voorgesteld' via info-icoon -->
  <rect x='16' y='82' width='358' height='118' rx='12' fill='#ffffff'/>
  <circle cx='38' cy='114' r='9' fill='none' stroke='#1f7a3d' stroke-width='2'/>
  <circle cx='38' cy='114' r='4' fill='#1f7a3d'/>
  <text x='56' y='119' font-size='15' fill='#1c2b1f'>melk</text>
  <text x='350' y='119' font-size='15' fill='#1f7a3d' text-anchor='end'>ℹ️
    <title>Voorgesteld hoofdproduct — kanjer-regel: kortste benaming met de minste woorden → meest gebruikt in recepten → alfabetisch eerste</title>
  </text>
  <line x1='24' y1='132' x2='366' y2='132' stroke='#eef1ee'/>
  <circle cx='38' cy='156' r='9' fill='none' stroke='#9aa89e' stroke-width='2'/>
  <text x='56' y='161' font-size='15' fill='#1c2b1f'>volle melk</text>
  <text x='350' y='161' font-size='12' fill='#8a978d' text-anchor='end'>1 recept</text>
  <line x1='24' y1='178' x2='366' y2='178' stroke='#eef1ee'/>
  <text x='32' y='200' font-size='11' fill='#8a978d'>ℹ️ tags per recept</text>

  <!-- per-recept tag: logisch afgeleid uit benamingsverschil, aanpasbaar/verwijderbaar -->
  <rect x='16' y='216' width='358' height='96' rx='12' fill='#ffffff'/>
  <text x='32' y='242' font-size='13' font-weight='600' fill='#1c2b1f'>pannenkoeken</text>
  <rect x='32' y='254' width='58' height='28' rx='14' fill='#e8f3ea'/>
  <text x='48' y='273' font-size='13' fill='#1f7a3d'>vol</text>
  <text x='98' y='273' font-size='12' fill='#5b6b5f'>✕</text>
  <rect x='118' y='254' width='86' height='28' rx='14' fill='none' stroke='#c9d4cb'/>
  <text x='130' y='273' font-size='13' fill='#8a978d'>+ tag</text>
  <text x='356' y='242' font-size='15' fill='#1f7a3d' text-anchor='end'>ℹ️
    <title>Tags gelden alléén voor dit recept (niet voor het product in het algemeen). Aanpasbaar en verwijderbaar. Zichtbaar in recept én weekmenu.</title>
  </text>

  <!-- sessie-undo als icoon -->
  <text x='20' y='712' font-size='14' fill='#5b6b5f'>⟲
    <title>Samenvoegen is binnen deze sessie ongedaan te maken; daarna permanent</title>
  </text>

  <!-- acties -->
  <rect x='16' y='728' width='172' height='52' rx='10' fill='#e8f0e9'/>
  <text x='102' y='759' font-size='15' fill='#1f7a3d' text-anchor='middle'>Annuleren</text>
  <rect x='202' y='728' width='172' height='52' rx='10' fill='#1f7a3d'/>
  <text x='288' y='759' font-size='15' font-weight='600' fill='#ffffff' text-anchor='middle'>Samenvoegen</text>
</svg>
