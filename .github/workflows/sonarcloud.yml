name: sonarcloud
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  # pull-requests: write is nodig voor PR-decoratie door de SonarCloud-action
  pull-requests: write
jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is nodig voor blame/PR-decoratie door SonarCloud
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Installeer dependencies exact volgens lockfile
        run: npm ci
      # De tests draaien onder c8, zodat coverage/lcov.info ontstaat voor de scan
      - name: Tests met coverage (c8 -> coverage/lcov.info)
        run: npm run test:coverage
      - name: SonarCloud-scan
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
