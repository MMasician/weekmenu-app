name: build-and-test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (src/App.jsx -> src/app.js)
        run: npm run build
      - name: Controleer dat src/app.js synchroon is met src/App.jsx
        run: git diff --exit-code src/app.js
      - name: Tests
        run: npm test
