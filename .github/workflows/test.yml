name: build-and-test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # npm ci is nodig sinds de tests via c8 draaien (devDependency)
      - name: Installeer dependencies exact volgens lockfile
        run: npm ci
      - name: Build (src/App.jsx -> src/app.js)
        run: npm run build
      - name: Controleer dat src/app.js synchroon is met src/App.jsx
        run: git diff --exit-code src/app.js
      - name: Tests met coverage (c8 -> coverage/lcov.info)
        run: npm run test:coverage
