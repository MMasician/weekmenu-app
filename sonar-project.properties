sonar.organization=mmasician
sonar.projectKey=MMasician_weekmenu-app

# De app-code die daadwerkelijk draait (en getest wordt) is de gecompileerde
# src/app.js; src/App.jsx is de bron ervan en wordt door ESLint + tsc gedekt.
# vendor/, studio/ (aparte Python-monorepo) en gegenereerde output zijn excluded.
# sources en tests moeten disjoint zijn (anders "can't be indexed twice"):
# tools/ is test-infrastructuur (runner, harness, test-*.cjs).
sonar.sources=src,sw.js
sonar.tests=tools
sonar.exclusions=src/App.jsx,vendor/**,studio/**,node_modules/**,package-lock.json,coverage/**

# Coverage komt uit de c8-run van `npm run test:coverage` (zie .github/workflows/sonarcloud.yml)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
